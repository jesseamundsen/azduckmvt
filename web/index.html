<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzDuckMVT Client</title>
    <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .control-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 0 0 2px rgba(0,0,0,0.1);
            font-family: sans-serif;
            z-index: 1;
        }
        .layer-selector { display: grid; gap: 6px; }
        .layer-selector label { display: flex; align-items: center; gap: 6px; font-size: 14px; }
        .github-link {
            position: absolute; bottom: 10px; left: 10px; background: white; padding: 5px;
            border-radius: 4px; box-shadow: 0 0 0 2px rgba(0,0,0,0.1); font-family: sans-serif; z-index: 1; font-size: 12px;
        }
        .github-link a { text-decoration: none; color: #333; }
    </style>
</head>
<body>
    <div class="control-panel">
        <div class="layer-selector" aria-label="Map layers">
            <label><input type="checkbox" data-layer="nad_2026_addresses" checked> Addresses</label>
            <label><input type="checkbox" data-layer="overture_2026_buildings" checked> Buildings</label>
            <label><input type="checkbox" data-layer="tiger_2026_roads" checked> Roads</label>
        </div>
    </div>
    <div class="github-link">
        <a href="https://github.com/jesseamundsen/azduckmvt/" target="_blank">View on GitHub</a>
    </div>
    <div id="map"></div>

    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                'version': 8,
                'sources': {
                    'google-hybrid': {
                        'type': 'raster',
                        'tiles': ['https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}'],
                        'tileSize': 256,
                        'attribution': '&copy; Google',
                        'maxzoom': 19
                    }
                },
                'layers': [
                    {
                        'id': 'google-hybrid',
                        'type': 'raster',
                        'source': 'google-hybrid'
                    }
                ]
            },
            center: [-84.51878883201181, 38.03498836733132], // Center of KY
            zoom: 10
        });

        const layerStyles = {
            tiger_2026_roads: {
                type: 'line',
                paint: { 'line-color': '#e63946', 'line-width': 2, 'line-opacity': 0.6 }
            },
            overture_2026_buildings: {
                type: 'fill',
                paint: {
                    'fill-color': '#f4a261',
                    'fill-opacity': 0.55,
                    'fill-outline-color': '#b85c38'
                }
            },
            nad_2026_addresses: {
                type: 'circle',
                paint: {
                    'circle-radius': 4,
                    'circle-color': '#1565c0',
                    'circle-stroke-color': '#ffffff',
                    'circle-stroke-width': 1
                }
            }
        };

        const addLayer = (layer) => {
            const sourceId = `${layer}-source`;
            const layerId = `${layer}-layer`;
            const tileUrl = `https://azduckmvtfunction.azurewebsites.net/api/tiles/${layer}/{z}/{x}/{y}`;

            map.addSource(sourceId, {
                type: 'vector',
                tiles: [tileUrl],
                minzoom: 12,
                maxzoom: 14
            });

            map.addLayer({
                'id': layerId,
                'type': layerStyles[layer].type,
                'source': sourceId,
                'source-layer': layer,
                'paint': layerStyles[layer].paint
            });
        };

        map.on('load', () => {
            const showPopup = (e) => {
                const props = e.features[0].properties;
                let content = '<div style="font-family: sans-serif; font-size: 12px;">';
                for (const key in props) {
                    content += `<strong>${key}:</strong> ${props[key]}<br/>`;
                }
                content += '</div>';

                new maplibregl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(content)
                    .addTo(map);
            };

            // Add from bottom to top: roads, buildings, then addresses.
            Object.keys(layerStyles).forEach((layer) => {
                addLayer(layer);
                const layerId = `${layer}-layer`;
                map.on('click', layerId, showPopup);
                map.on('mouseenter', layerId, () => {
                    map.getCanvas().style.cursor = 'pointer';
                });
                map.on('mouseleave', layerId, () => {
                    map.getCanvas().style.cursor = '';
                });
            });

            document.querySelectorAll('[data-layer]').forEach((input) => {
                input.addEventListener('change', (e) => {
                    const layerId = `${e.target.dataset.layer}-layer`;
                    map.setLayoutProperty(layerId, 'visibility', e.target.checked ? 'visible' : 'none');
                });
            });
        });
    </script>
</body>
</html>
