<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzDuckMVT Client</title>
    <script src="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.0.0/dist/maplibre-gl.css" rel="stylesheet" />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        .control-panel {
            position: absolute;
            top: 10px;
            left: 10px;
            background: white;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 0 0 2px rgba(0,0,0,0.1);
            font-family: sans-serif;
            z-index: 1;
        }
        select { font-size: 14px; padding: 4px; }
        .github-link {
            position: absolute; bottom: 10px; left: 10px; background: white; padding: 5px;
            border-radius: 4px; box-shadow: 0 0 0 2px rgba(0,0,0,0.1); font-family: sans-serif; z-index: 1; font-size: 12px;
        }
        .github-link a { text-decoration: none; color: #333; }
    </style>
</head>
<body>
    <div class="control-panel">
        <label for="layer">Layer:</label>
        <select id="layer">
            <option value="tiger_2026_roads">tiger_2026_roads</option>
            <option value="nad_2026_addresses">nad_2026_addresses</option>
            <option value="overture_2026_buildings">overture_2026_buildings</option>
        </select>
    </div>
    <div class="github-link">
        <a href="https://github.com/jesseamundsen/azduckmvt/" target="_blank">View on GitHub</a>
    </div>
    <div id="map"></div>

    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                'version': 8,
                'sources': {
                    'osm': {
                        'type': 'raster',
                        'tiles': ['https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'],
                        'tileSize': 256,
                        'attribution': '&copy; OpenStreetMap Contributors',
                        'maxzoom': 19
                    }
                },
                'layers': [
                    {
                        'id': 'osm',
                        'type': 'raster',
                        'source': 'osm'
                    }
                ]
            },
            center: [-84.51878883201181, 38.03498836733132], // Center of KY
            zoom: 10
        });

        const updateLayer = (layer) => {
            const sourceId = 'mvt-source';
            const layerId = 'mvt-layer';
            const tileUrl = `https://azduckmvtfunction.azurewebsites.net/api/tiles/${layer}/{z}/{x}/{y}`;

            // Remove existing layer and source if they exist
            if (map.getLayer(layerId)) map.removeLayer(layerId);
            if (map.getSource(sourceId)) map.removeSource(sourceId);

            map.addSource(sourceId, {
                type: 'vector',
                tiles: [tileUrl],
                minzoom: 10,
                maxzoom: 14
            });

            map.addLayer({
                'id': layerId,
                'type': 'fill',
                'source': sourceId,
                'source-layer': layer
            });
        };

        map.on('load', () => {
            map.on('click', 'mvt-layer', (e) => {
                const props = e.features[0].properties;
                let content = '<div style="font-family: sans-serif; font-size: 12px;">';
                for (const key in props) {
                    content += `<strong>${key}:</strong> ${props[key]}<br/>`;
                }
                content += '</div>';

                new maplibregl.Popup()
                    .setLngLat(e.lngLat)
                    .setHTML(content)
                    .addTo(map);
            });

            map.on('mouseenter', 'mvt-layer', () => {
                map.getCanvas().style.cursor = 'pointer';
            });

            map.on('mouseleave', 'mvt-layer', () => {
                map.getCanvas().style.cursor = '';
            });

            const select = document.getElementById('layer');
            
            // Initialize
            updateLayer(select.value);

            // Handle change
            select.addEventListener('change', (e) => {
                updateLayer(e.target.value);
            });
        });
    </script>
</body>
</html>
